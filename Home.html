<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Services - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            max-height: 100vh;
            overflow-y: auto;
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
            color: white;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }
        .brand h1 {
            color: #f8fafc;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .brand p {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
        }
        .card h2 {
            color: #f8fafc;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
            outline: none;
        }
        .input-group input::placeholder {
            color: #64748b;
        }
        .input-group input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #60a5fa;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .links a:hover {
            color: #93c5fd;
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(148, 163, 184, 0.15);
        }
        .divider span {
            color: #64748b;
            font-size: 12px;
            padding: 0 12px;
        }
        .hidden { display: none; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #f8fafc;
        }
        .footer {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand">
            <div class="brand-icon">&#9881;</div>
            <h1>Civic Services & DBMS</h1>
            <p>Panchayat Management System</p>
        </div>

        <!-- Login Form -->
        <div id="login-form" class="card">
            <h2>Welcome Back</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter your username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" required>
            </div>
            <button class="btn-primary" onclick="login()">Sign In</button>
            <div class="links">
                <a onclick="showForgotPassword()">Forgot Password?</a>
            </div>
            <div class="divider"><span>or</span></div>
            <div class="links">
                <a onclick="showSignup()">Create an account</a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="card hidden">
            <div class="back-link" onclick="showLogin()">&#8592; Back to Login</div>
            <h2>Create Account</h2>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" placeholder="Enter your full name" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="signup-google" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="signup-phone" placeholder="Enter phone number" required>
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="signup-username" placeholder="Choose a username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="Create a password" required>
            </div>
            <button class="btn-primary" onclick="signup()">Create Account</button>
            <div class="links" style="margin-top: 16px;">
                <a onclick="showLogin()">Already have an account? Sign In</a>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgot-password-form" class="card hidden">
            <div class="back-link" onclick="showLogin()">&#8592; Back to Login</div>
            <h2>Reset Password</h2>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="forgot-username" placeholder="Enter your username" required>
            </div>
            <button class="btn-primary" onclick="resetPassword()">Send Reset Link</button>
            <div class="links" style="margin-top: 16px;">
                <a onclick="showLogin()">Back to Login</a>
            </div>
        </div>

        <div class="footer">
            Managed by Panchayat Raj Institution
        </div>
    </div>

    <script>
        function showSignup() {
            document.getElementById("login-form").classList.add("hidden");
            document.getElementById("signup-form").classList.remove("hidden");
            document.getElementById("forgot-password-form").classList.add("hidden");
        }

        function showLogin() {
            document.getElementById("login-form").classList.remove("hidden");
            document.getElementById("signup-form").classList.add("hidden");
            document.getElementById("forgot-password-form").classList.add("hidden");
        }

        function showForgotPassword() {
            document.getElementById("login-form").classList.add("hidden");
            document.getElementById("signup-form").classList.add("hidden");
            document.getElementById("forgot-password-form").classList.remove("hidden");
        }

        function login() {
            let username = document.getElementById("login-username").value;
            let password = document.getElementById("login-password").value;

            if (password === "") {
                alert("Please enter your password.");
                return;
            }

            let serverURL = window.location.origin + "/login";

            fetch(serverURL, {  
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    username: username, 
                    password: password 
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log("Response Data:", data);
                if (data.success) {
                    if(data.Admin){
                        window.location.href = `/admin?password=${data.password}`;
                    }
                    else if(data.Monitor){
                        window.location.href = `/home?id=${data.id}&monitor=${true}`;
                    }
                    else{
                        window.location.href = `/home?id=${data.id}`;
                    }  
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Something went wrong!");
            });
        }

        function signup() {
            let name = document.getElementById("signup-name").value;
            let google = document.getElementById("signup-google").value;
            let phone = document.getElementById("signup-phone").value;
            let username = document.getElementById("signup-username").value;
            let password = document.getElementById("signup-password").value;

            if (name === "" || google === "" || phone === "" || username === "" || password === "") {
                alert("Please fill in all fields.");
                return;
            }

            alert("Sign up successful for " + username);
        }

        function resetPassword() {
            let username = document.getElementById("forgot-username").value;

            if (username === "") {
                alert("Please enter your username.");
                return;
            }

            alert("A password reset link has been sent to " + username);
        }
    </script>

</body>
</html>
